[project]
name = "compression-kit"
version = "0.2.0"
description = "AI-powered compression toolkit for physiological signals targeting edge and wearable devices."
authors = [
    {name = "Ambiq AI", email = "support.aitg@ambiq.com"},
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-MODEL-WEIGHTS.md"]
requires-python = ">=3.12,<3.13"

dependencies = [
    "keras>=3.12.0",
    "notebook>=7.4.7",
    "numpy>=2.0,<2.5",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "h5py>=3.12.1",
    "pyyaml>=6.0.1",
    "pywavelets>=1.6.0",
    "physiokit>=0.9.0",
    "pyedflib>=0.1.42",
    "tensorflow>=2.18.0,<3.0",
    "tensorflow-metal>=1.1.0,<2.0; sys_platform == 'darwin'",
    "pydantic>=2.12.4",
    "ai-edge-litert>=2.1.2",
    "wandb>=0.17",
    "helia-edge>=0.6.0",
    "plotly>=6.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
ingest = [
    # Used by scripts/datasets/* to fetch + convert public datasets into the
    # canonical h5 layout. Not required at training/inference time.
    "wfdb>=4.1",
    "requests>=2.32",
    "tqdm>=4.66",
]


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["compressionkit", "compressionkit.*"]

[project.scripts]
compressionkit = "compressionkit.recipes:dispatch"
train-ecg-rvq = "compressionkit.recipes.train_ecg_rvq:main"
train-ppg-rvq = "compressionkit.recipes.train_ppg_rvq:main"

[project.optional-dependencies]
hf = [
    "huggingface-hub>=0.25",
]

[tool.uv]
package = true

# ───────────────────────────────────────────────────────────────
# Ruff — linter + formatter
# ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "site", "slides", ".venv", "results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long (formatter handles)
    "E741",   # ambiguous-variable-name (l, I etc. in legacy code)
    "B008",   # function-call-in-default-argument (common in Keras configs)
    "B905",   # zip-without-explicit-strict (noisy; default strict=False is fine)
    "SIM108", # ternary instead of if/else (readability preference)
    "SIM117", # multiple-with-statements (readability preference)
    "RUF001", # ambiguous-unicode-character-string (we use ×, – intentionally)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF059", # unused-unpacked-variable (common in tensor shape unpacking)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/**" = ["E402"]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["compressionkit", "experiments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ───────────────────────────────────────────────────────────────
# Pytest
# ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that are slow to run (e.g., real training runs)",
    "gpu: tests that require a GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:keras.*",
]

# ───────────────────────────────────────────────────────────────
# Coverage
# ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["compressionkit"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
