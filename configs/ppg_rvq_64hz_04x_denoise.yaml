# Golden 4x model retrained with Tier-1 augmentations for denoising + generalization.
# Input = corrupted (baseline wander, motion, beat scaling, real noise)
# Target = clean (after LayerNorm)
# This teaches the codec to simultaneously compress AND denoise.
run_name: ppg_rvq_64hz_04x_denoise

data:
  datasets_dir: /home/vscode/datasets
  dataset_glob: "mesa-commercial-use/polysomnography/edfs/*.edf"
  sampling_rate: 64
  frame_size: 320
  segment_samples: 640
  offset_samples: 192
  target_label: Pleth
  batch_size: 64
  buffer_size: 10000
  steps_per_epoch: 50
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42

  cache:
    enabled: true
    cache_root: datasets/ppg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 512
    windows_per_subject_val: 512
    train_ratio: 0.8
    val_ratio: 0.2

  augmentation:
    enabled: true
    baseline_wander_prob: 0.3
    motion_artifact_prob: 0.3
    beat_scale_prob: 0.2
    time_warp_prob: 0.2
    empirical_noise_prob: 0.3
    noise_bank_sources:
      - ppg_dalia
      - wesad
    noise_bank_max_segments: 2000
    noise_bank_root: /home/vscode/datasets

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 2
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  encoder_block_norm: batch
  encoder_head_norm: none
  decoder_block_norm: none
  decoder_head_norm: layer
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 5000
    t_mul: 2.0
    m_mul: 0.9
    alpha: 0.0001
  selection_metric: val_prd
  val_metric: prd
  val_mode: min
  early_stop_patience: 30
  reduce_lr_on_plateau: false
  derivative_loss:
    enabled: false
  spectral_loss:
    enabled: false
  validation_steps: 50

evaluation:
  num_samples: 1000
  num_plot_samples: 10
  input_bit_depth: 16
  band_metrics:
    enabled: true
    low_hz: 0.5
    high_hz: 8.0
    order: 3
  physiokit_metrics:
    enabled: true
    low_hz: 0.5
    high_hz: 8.0
    order: 3
    min_peaks: 5
  long_recording:
    enabled: true
    duration_sec: 60.0
    hop_ratio: 0.5
    num_recordings: 50
    batch_size: 64

output:
  results_root: results
  log_file: train.log
  tensorboard: true
