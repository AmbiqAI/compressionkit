# Golden ECG RVQ config: 8× compression (ds=8, levels=2, eff=32 Hz)
# Incorporates all validated improvements:
#   - EMA codebook updates (decay=0.99)
#   - Wider encoder/decoder (base_filters=48, multiplier=1.25)
#   - Larger codebook (512 entries)
#   - Filtered MSE loss (Nyquist-aware cutoff)
#   - Derivative loss for waveform fidelity
#   - Cosine-restart LR schedule
#   - TFRecord caching
# Best result: val_mse=0.003833, PRD=6.42%, cos=0.9979 (epoch 192)
run_name: ecg_rvq_256hz_08x_golden

data:
  dataset_id: ptb-xl
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 300
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 3       # 2^3 = 8× downsample
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_decay
    first_decay_steps: 60000
    alpha: 0.001
  val_metric: mse
  val_mode: min
  early_stop_patience: 100
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 160
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 20.0
    num_taps: 65

evaluation:
  num_samples: 500
  input_bit_depth: 16

output:
  results_root: results
