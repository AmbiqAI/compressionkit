# Experiment E: Combined — best of A + C + D + B
# Clean target + more data + strong augmentation + derivative loss
run_name: ecg_rvq_08x_E_combined

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  frame_size: 1024
  segment_samples: 5000
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 100
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2
  target_filter:
    enabled: true
    low_hz: 0.5
    high_hz: 40.0
    order: 3
    forward_backward: true
  augmentation:
    gaussian_noise: [0.02, 0.15]
    amplitude_warp: true
    amplitude_warp_amplitude: [0.05, 0.2]
    amplitude_warp_frequency: [1.0, 5.0]
    random_cutout: true
    cutout_factor: [0.01, 0.05]

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 3
  base_filters: 32
  multiplier: 1.25
  beta: 0.25

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 25
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1

evaluation:
  num_samples: 50
  input_bit_depth: 16

output:
  results_root: results
