# ECG FSQ 16x compression: WIDER bottleneck (8-dim vs 6-dim).
# levels=[4,4,4,4,4,4,4,4] -> 65,536 codes -> exactly 16.0 bits/position
# 32 latent positions x 16 bits = 512 bits = 16.00x compression
#
# Hypothesis: 6-dim FSQ underperforms RVQ golden because the encoder must
# project everything into only 6 channels. Going to 8-dim doubles the
# effective channel capacity into the bottleneck while keeping the same
# bits/position target.
run_name: ecg_rvq_256hz_16x_fsq_wide8

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 8           # forced to len(fsq_levels)
  latent_width: 256          # ignored
  num_levels: 1              # ignored
  num_stages: 4
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: false
  bottleneck_type: fsq
  fsq_levels: [4, 4, 4, 4, 4, 4, 4, 4]   # 4^8 = 65536 codes, 16.0 bits/pos

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 10.0
    num_taps: 65

evaluation:
  num_samples: 50
  input_bit_depth: 16

output:
  results_root: results
