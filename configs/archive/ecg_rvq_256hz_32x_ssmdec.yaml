# Run B: golden RVQ encoder + diagonal-SSM (S4D) decoder, 32× compression.
# Asymmetric "small encoder, big decoder" recipe motivated by the edge-AI
# constraint: encoder runs on an MCU (must be small + INT8-portable), decoder
# runs on an A-class CPU or in the cloud (size doesn't matter).
# Encoder, RVQ, training schedule, and losses match ecg_rvq_256hz_32x_golden.
# Only the decoder differs: UpSampling2D + 1x1 Conv2D + S4DBlocks per stage.
run_name: ecg_rvq_256hz_32x_ssmdec

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 1
  num_stages: 4
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: true
  ema_decay: 0.99
  # --- Run B additions ---
  decoder_type: ssm
  decoder_state_size: 32
  decoder_num_ssm_blocks: 2

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 10.0
    num_taps: 65

evaluation:
  num_samples: 50
  input_bit_depth: 16
  stitching:
    enabled: true
    methods: ["hard_concat", "overlap_add", "linear_crossfade", "tukey_overlap_add"]
    hop_ratio: 0.5
    num_recordings: 10
    duration_sec: 30.0

output:
  results_root: results
