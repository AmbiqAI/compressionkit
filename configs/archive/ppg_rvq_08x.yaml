# Golden PPG RVQ config — 8× compression (ds8, l2)
run_name: ppg_rvq_08x_ds8_l2

data:
  datasets_dir: datasets
  dataset_glob: mesa-commercial-use/polysomnography/edfs/*.edf
  sampling_rate: 64
  frame_size: 320
  segment_samples: 640
  offset_samples: 192
  target_label: Pleth
  batch_size: 64
  buffer_size: 10000
  steps_per_epoch: 50
  epochs: 100
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ppg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 512
    windows_per_subject_val: 512
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 3
  base_filters: 32
  multiplier: 1.25
  beta: 0.25

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 50
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 25
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 8

evaluation:
  num_samples: 50
  input_bit_depth: 16

output:
  results_root: results
  tensorboard: true
  wandb:
    enabled: false
    project: compression-kit
    tags: [ppg, rvq, 8x, golden-v1]
