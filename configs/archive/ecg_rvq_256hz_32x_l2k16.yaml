# 32× ECG RVQ — multi-level codebook variant
#
# Hypothesis: 2 codebooks × 16 entries (4+4 bits/position) maintains the
# same 32× compression as the golden 1×256 baseline while spreading the
# representation across multiple smaller codebooks. Smaller codebooks
# tend to have higher utilisation (fewer dead codes) and the residual
# structure is captured hierarchically — coarse on level 0, fine on
# level 1. This also produces a more "compressible" token stream for
# downstream entropy coding.
#
# Compression accounting:
#   latent_positions = frame_size / downsample_factor = 512 / 16 = 32
#   bits_per_position = num_levels * log2(latent_width) = 2 * 4 = 8
#   compressed_bits   = 32 * 8 = 256
#   raw_bits          = 512 * 16 = 8192
#   ratio             = 8192 / 256 = 32×                                 ✓
#
# Beta anneal: start at 1.0 to keep the encoder near both codebooks
# during the codebook bootstrap phase, anneal to 0.1 by epoch 100 so
# the encoder can refine without being over-constrained.
run_name: ecg_rvq_256hz_32x_l2k16

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 16   # K per level (smaller, higher utilisation)
  num_levels: 2      # 2 codebooks → 4+4 = 8 bits/position
  num_stages: 4      # 2^4 = 16× spatial
  base_filters: 48
  multiplier: 1.25
  beta: 0.25         # initial value; overridden by beta_anneal when enabled
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 10.0
    num_taps: 65
  beta_anneal:
    enabled: true
    start: 1.0
    end: 0.1
    epochs: 100
    mode: cosine

evaluation:
  num_samples: 50
  input_bit_depth: 16
  stitching:
    enabled: true
    methods: ["hard_concat", "overlap_add", "linear_crossfade", "tukey_overlap_add"]
    hop_ratio: 0.5
    num_recordings: 10
    duration_sec: 30.0

output:
  results_root: results
