# ECG decimation baseline — 8× downsample + linear upsample
run_name: ecg_decimate_08x

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  frame_size: 1024
  lead_index: 1          # Lead II
  shuffle_seed: 42

decimation:
  factor: 8
  input_bit_depth: 16

evaluation:
  num_samples: 500

output:
  results_root: results
