# PPG RVQ 8× compression — DWT domain (db4, 4 levels)
run_name: ppg_rvq_64hz_08x_wavelet

data:
  datasets_dir: datasets
  dataset_glob: mesa-commercial-use/polysomnography/edfs/*.edf
  sampling_rate: 64
  frame_size: 320
  segment_samples: 640
  offset_samples: 192
  target_label: Pleth
  batch_size: 64
  buffer_size: 10000
  steps_per_epoch: 50
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  transform:
    domain: dwt
    dwt_levels: 4
    dwt_wavelet: db4
  cache:
    enabled: true
    cache_root: datasets/ppg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 512
    windows_per_subject_val: 512
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 3
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  derivative_loss:
    enabled: true
    weight: 0.1
  spectral_loss:
    enabled: false
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 8

evaluation:
  num_samples: 50
  input_bit_depth: 16
  physiokit_metrics:
    enabled: true
    low_hz: 0.5
    high_hz: 8.0
    order: 3
    min_peaks: 5
  long_recording:
    enabled: true
    duration_sec: 60.0
    hop_ratio: 0.5
    num_recordings: 400
    batch_size: 32
