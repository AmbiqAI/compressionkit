# ECG RVQ 32× compression with 2-level RVQ
# Hypothesis: 5 encoder stages (32x spatial → 16 positions) + 2 RVQ levels
#   gives the same 256-bit budget (16 pos × 2 levels × 8 bits = 256 bits = 32x)
#   but the residual VQ captures quantization error from level 1 in level 2,
#   effectively doubling codebook expressiveness.
# Baseline: ecg_rvq_256hz_32x_golden (val_mse=0.018801, PRD=14.23%, cos=0.9897)
run_name: ecg_rvq_256hz_32x_golden_2lvl

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2          # was 1 → residual VQ captures level-1 quantization error
  num_stages: 5          # was 4 → 2^5=32x spatial, 16 latent positions
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 10.0
    num_taps: 65

evaluation:
  num_samples: 500
  input_bit_depth: 16
  stitching:
    enabled: true
    methods: ["hard_concat", "overlap_add", "linear_crossfade", "tukey_overlap_add"]
    hop_ratio: 0.5
    num_recordings: 10
    duration_sec: 30.0

output:
  results_root: results
