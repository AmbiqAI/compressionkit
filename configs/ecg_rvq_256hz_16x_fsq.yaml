# ECG RVQ 16× compression: Finite Scalar Quantization (FSQ) bottleneck
# Replaces the learned RVQ codebook with parameter-free scalar quantization.
#
# FSQ levels [8, 8, 8, 5, 5, 5]:
#   - implicit codebook size = 8*8*8*5*5*5 = 64,000 codes
#   - bits per latent position = log2(64000) = 15.97
#   - 32 latent positions x 15.97 bits = 511 bits = 16x compression
#
# Compared to RVQ 16x golden:
#   - Same encoder/decoder, but embedding_dim becomes 6 (= len(levels))
#   - No codebook to ship on-device (no malloc, no lookup table)
#   - No commitment loss, no EMA, no codebook collapse
run_name: ecg_rvq_256hz_16x_fsq

data:
  datasets_dir: datasets
  dataset_glob: ptbxl/*.h5
  sampling_rate: 500
  target_sample_rate: 256
  frame_size: 512
  segment_samples: 768
  lead_index: 1
  batch_size: 64
  buffer_size: 20000
  steps_per_epoch: 200
  epochs: 200
  epsilon: 0.001
  gaussian_noise: [0.01, 0.1]
  shuffle_seed: 42
  cache:
    enabled: true
    cache_root: datasets/ecg_tfrecord_cache
    auto_build: true
    force_rebuild: false
    min_segment_scale: 1.2
    windows_per_subject_train: 32
    windows_per_subject_val: 8
    train_ratio: 0.8
    val_ratio: 0.2

model:
  embedding_dim: 6           # forced to len(fsq_levels), kept for clarity
  latent_width: 256          # ignored when bottleneck_type=fsq
  num_levels: 1              # ignored when bottleneck_type=fsq
  num_stages: 4              # 2^4 = 16x downsample → 32 latent positions
  base_filters: 48
  multiplier: 1.25
  beta: 0.25                 # ignored for FSQ
  use_ema: false             # ignored for FSQ
  bottleneck_type: fsq
  fsq_levels: [8, 8, 8, 5, 5, 5]

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_restarts
    first_decay_steps: 200
    t_mul: 2.0
    m_mul: 1.0
    alpha: 0.01
  val_metric: mse
  val_mode: min
  early_stop_patience: 50
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 16
  derivative_loss:
    enabled: true
    weight: 0.1
  filtered_loss:
    enabled: true
    weight: 1.0
    cutoff_hz: 10.0
    num_taps: 65

evaluation:
  num_samples: 50
  input_bit_depth: 16

output:
  results_root: results
