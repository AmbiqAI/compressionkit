# Entropy prior paired with golden codec ecg-rvq-4x (#27).
parent_experiment: ecg-rvq-4x

arch:
  embed_dim: 64
  num_layers: 2
  num_heads: 4
  ffn_dim: 128

training:
  num_train_files: 200
  context_frames: 4
  stride_tokens: 8
  epochs: 10
  batch_size: 128
  learning_rate: 3.0e-4
  val_fraction: 0.1
  weight_decay: 1.0e-4

export_tflite: true
