# Golden PPG RVQ config — 16× compression (ds16, l2)
# EMA codebook, wider model, derivative loss, physiokit HR/HRV eval
run_name: ppg_rvq_64hz_16x_golden

data:
  sampling_rate: 64
  frame_size: 320
  batch_size: 64
  buffer_size: 10000
  steps_per_epoch: 50
  epochs: 300
  epsilon: 0.001
  gaussian_noise: [0.0, 0.0]
  shuffle_seed: 42
  unified_cache:
    enabled: true
    cache_root: datasets/ppg_cache_strict_sanitize
    shuffle_buffer: 10000
    sources:
      - {slug: bidmc, weight: 1.0}
      - {slug: butppg, weight: 0.25}
      - {slug: ppg_dalia, weight: 1.0}
      - {slug: wesad, weight: 1.0}
  # Faithful (recover-only) morphology suite: target == input, so clean PRD stays
  # apples-to-apples with SPIHT. Expands the valid-signal manifold (HRV/perfusion/
  # slow drift) without teaching denoising. See experiments/ppg_v1_augmentation_eval_design.md.
  artifact_suite:
    enabled: true
    faithful_all: false
    normalize_after: true
    noise_budget:
      max_simultaneous: 2
      min_post_corruption_snr_db: 9.0
      enforce: scale_down
    curriculum:
      enabled: true
      start_scale: 0.1
      end_scale: 1.0
      ramp_epochs: 50
      schedule: linear
    artifacts:
      - {name: time_warp, role: recover, param: max_warp_fraction, prob: 0.20, severity_min: 0.08, severity_max: 0.15, higher_is_worse: true}
      - {name: beat_scale, role: recover, param: scale_spread, prob: 0.15, severity_min: 0.10, severity_max: 0.20, higher_is_worse: true}
      - {name: baseline_wander, role: recover, param: amplitude, prob: 0.20, severity_min: 0.05, severity_max: 0.20, higher_is_worse: true}

model:
  embedding_dim: 16
  latent_width: 256
  num_levels: 2
  num_stages: 4
  base_filters: 48
  multiplier: 1.25
  beta: 0.25
  use_ema: true
  ema_decay: 0.99

training:
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    type: cosine_decay
    first_decay_steps: 60000
    alpha: 0.001
  derivative_loss:
    enabled: true
    weight: 0.1
  spectral_loss:
    enabled: false
    weight: 0.5
    fft_sizes: [16, 32, 64, 128]
  val_metric: mse
  val_mode: min
  early_stop_patience: 100
  reduce_lr_on_plateau: false
  selection_metric: val_mse
  validation_steps: 160

evaluation:
  num_samples: 10000
  input_bit_depth: 16
  physiokit_metrics:
    enabled: true
    low_hz: 0.5
    high_hz: 8.0
    order: 3
    min_peaks: 5
  long_recording:
    enabled: true
    duration_sec: 60.0
    hop_ratio: 0.5
    num_recordings: 400
    batch_size: 32

output:
  results_root: results
  tensorboard: true
