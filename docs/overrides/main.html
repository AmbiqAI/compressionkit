{% extends "base.html" %}

{# Header uses icon-only PNG #}
{% block site_name %}
  <a href="{{ config.site_url | d(nav.homepage.url, true) }}" class="md-header__button md-logo" aria-label="{{ config.site_name }}" data-md-component="logo">
    <img src="{{ 'assets/compressionkit-icon.png' | url }}" alt="{{ config.site_name }}" style="height:1.8rem;">
  </a>
{% endblock %}
